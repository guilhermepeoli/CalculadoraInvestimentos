<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Investimentos Impressionadora</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body class="h-[100dvh] grid grid-cols-3 grid-rows-2 ">
  <aside class="row-span-2 h-[100dvh]  gap-10 bg-emerald-300  flex flex-col justify-around items-center">
    <h1 class="text-2xl font-medium px-6 py-2 ">CALCULADORA INVESTIMENTOS</h1>
    <form id="investment-form" class="w-full flex flex-col gap-2 px-6">
      <div class="flex w-full flex gap-1 flex-col h-[4.25rem]">
        <label for="starting-amount" class="font-semibold text-gray-700">Investimento inicial</label>
        <div class="flex">
          <input class="w-1/6 px-2 rounded-s-md ml-1 text-center " type="text" value="R$" disabled>
          <input class="px-2 w-5/6 text-center  rounded-r-md " type="text" id="starting-amount" name="starting-amount"
            placeholder="digite investimento inicial" required>

        </div>

      </div>
      <div class="flex w-full flex gap-1 flex-col h-[4.25rem]">
        <label for="additional-contribution" class="font-semibold text-gray-700">Aportes adicionais</label>
        <div class="flex">
          <input class="w-1/6 px-2 rounded-s-md ml-1 text-center" type="text" value="R$" disabled>
          <input class="px-2 w-5/6 text-center  rounded-r-md" type="text" id="additional-contribution"
            name="additional-contribution" placeholder="digite valor dos aportes">

        </div>
      </div>
      <div class="flex w-full flex gap-1 flex-col h-[4.25rem]">
        <label for="time-amount" class="font-semibold text-gray-700">Prazo</label>
        <div class="flex">
          <input class="px-2 w-2/3 text-center border-l-2 border-r-2 rounded-l-md" type="text" id="time-amount"
            name="time-amount" placeholder="digite o prazo" required>
          <select id="time-amount-period"
            class="text-center rounded-r-md w-1/3 hover:bg-emerald-900 hover:text-slate-200" id="evaluation-period ">
            <option class="" value="monthly">&#10003; Mensal</option>
            <option value="yearly">&#10003; Anual</option>
          </select>
        </div>
      </div>
      <div class="flex w-full flex gap-1 flex-col h-[4.25rem]">
        <label for="return-rate" class="font-semibold text-gray-700">Rentabilidade</label>
        <div class="flex">
          <input class="w-1/6 px-2 rounded-s-md ml-1 text-center" type="text" value="%" disabled>
          <input class="px-2 w-1/2 text-center border-l-2 border-r-2" type="text" id="return-rate" name="return-rate"
            placeholder="digite rentabilidade" required>
          <select
            class="before:content-['hello'] text-center rounded-r-md w-1/3 hover:bg-emerald-900 hover:text-slate-200"
            id="evaluation-period" name="evaluation-period">
            <option value="monthly">&#10003; Mensal</option>
            <option value="yearly">&#10003; Anual</option>
          </select>
        </div>

      </div>
      <div class="flex w-full flex gap-1 flex-col  h-[4.25rem]">
        <label for="tax-rate" class="font-semibold text-gray-700">Impostos sobre o lucro</label>
        <div class="flex">
          <input class="w-1/6 px-2 rounded-s-md ml-1 text-center" type="text" value="%" disabled>
          <input class="px-2 w-5/6 text-center  rounded-r-md" type="text" id="tax-rate" name="tax-rate"
            placeholder="digite percentual de imposto" required>

        </div>

      </div>
    </form>
    <div class="flex h-12 px-6 gap-2 w-full">
      <button form='investment-form' id="calculate-results"
        class="w-1/2 bg-emerald-950 hover:bg-emerald-800 rounded-md text-slate-200">Calcular</button>
      <button id="clean" class="w-1/2 hover:bg-emerald-500 rounded-md">Limpar</button>
    </div>
  </aside>
  <main class="row-span-2 col-span-2 relative">
    <section id="chart-container" class="h-full basis-full shrink-0">
      <div class="h-[36dvh] flex flex-col items-center pb-10">
        <p>RESULTADOS</p>
        <canvas class="!h-full" id="final-money-distribution"></canvas>
      </div>
      <div class="h-[56dvh] flex flex-col items-center pb-10">
        <p>PROGRESSÃO</p>
        <canvas id="progression"></canvas>
      </div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>

</html>
